<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201e31"><meta name="description" content="夕方の公園で、赤鬼からかくれんぼ。移動する場所をタップして逃げ切ろう。"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><title>Hide and Seek · 夕暮れの公園</title></head>
<body><main class="app"><header><div><span class="eyebrow">夕暮れの公園</span><h1>Hide <span>&</span> Seek</h1></div><button id="sound" class="small" aria-pressed="true" aria-label="音を切る">♪ ON</button></header>
<section class="dashboard" aria-label="ゲームの状態"><div><span class="eyebrow">のこり時間</span><strong id="clock">1:00</strong></div><div class="members"><span class="eyebrow">逃げている仲間</span><div id="members">● ● ● ● ●</div></div><div id="danger" class="danger">かくれよう</div></section>
<div class="field"><canvas id="park" width="840" height="1200" aria-label="公園のマップ。下の場所ボタンでも移動できます。"></canvas><div id="vignette"></div><div id="hint" class="hint">光る場所をタップして移動</div>
<section id="startPanel" class="overlay"><div class="card"><div class="moon">☾</div><span class="eyebrow">赤鬼が来るまえに…</span><h2>どこに、かくれる？</h2><p>光る場所をタップ。<br>鬼が近いときは、じっと待とう。</p><fieldset><legend>あそぶ時間</legend><div class="times"><button data-time="60" aria-pressed="true">1分</button><button data-time="180" aria-pressed="false">3分</button><button data-time="300" aria-pressed="false">5分</button></div></fieldset><button id="start" class="primary">かくれんぼ スタート →</button><p class="caption">青い帽子があなた ／ 赤い角が鬼</p></div></section>
<section id="resultPanel" class="overlay" hidden><div class="card"><span class="eyebrow">かくれんぼ おしまい</span><h2 id="resultTitle"></h2><p id="playerResult"></p><div id="resultStats" class="result-stats"></div><button id="again" class="primary">もういちど あそぶ ↻</button><button id="back" class="secondary">時間をえらび直す</button></div></section></div>
<footer><div class="status-line"><strong id="status" role="status">あなたは青い帽子</strong><button id="pause" class="small" disabled>一時停止</button></div><details><summary>移動する場所 ▾</summary><div id="locations" class="locations"></div></details><p class="legend"><i class="blue"></i>あなた <i class="orange"></i>仲間 <i class="red"></i>鬼　<span>◌ 光る場所へ移動</span></p></footer></main><script type="module" src="./app.js"></script></body></html>
